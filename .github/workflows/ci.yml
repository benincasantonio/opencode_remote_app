name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, custom_lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: make install

      - name: Generate code
        run: make generate

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Custom lint
        run: make custom-lint

      - name: Test
        run: flutter test
